services:
  appdash:
    image: msnishanth/appdash:latest
    container_name: appdash
    restart: unless-stopped
    ports:
      - "8080:80"

    volumes:
      # Edit apps.json on the host — no rebuild needed.
      - ./public/apps.json:/srv/apps.json:ro

      # Optional: override the default Caddyfile (e.g. to enable
      # /healthproxy/* reverse-proxy routes for status checks).
      # - ./Caddyfile:/etc/caddy/Caddyfile:ro

    # To build from source instead of pulling the published image, comment
    # out the `image:` line above and uncomment the `build:` line below.
    # build: .
